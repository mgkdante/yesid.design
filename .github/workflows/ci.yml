# Public-repository CI. Documentation-only PRs skip browser authority; byte-identical
# release prepares also skip Windows tokens and parity. `check` always runs, with
# release validation and packing for releases; required `ci` enforces selected results.
# Deliberately no push trigger (Q28): strict up-to-date protection plus squash merges
# mean the last PR run tested exactly what lands on main. Merge groups run full CI.
name: ci

on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.select.outputs.browser }}
      release-only: ${{ steps.select.outputs.release-only }}
      version: ${{ steps.select.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Policy CLI/env changes require two steps: land policy support first, then workflow use.
      - name: Materialize trusted policy
        id: policy
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == merge_group ]]; then
            [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid PR base SHA' >&2; exit 1; }
            git merge-base --is-ancestor "$BASE_SHA" origin/main || { echo 'PR base is not reachable from origin/main' >&2; exit 1; }
            revision="$BASE_SHA"
          else
            revision="$(git rev-parse origin/main)"
          fi
          directory="$(mktemp -d "$RUNNER_TEMP/ci-policy.XXXXXX")"
          mkdir "$directory/tools"
          # Complete local import closure; neither module reads files at load time.
          for file in tools/ci-policy.ts tools/ci-release.ts .bun-version; do
            git show "$revision:$file" > "$directory/$file"
          done
          version="$(cat "$directory/.bun-version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid trusted Bun version' >&2; exit 1; }
          # Start Bun outside checkout config discovery, then restore the existing CLI's cwd.
          echo 'process.chdir(process.env.GITHUB_WORKSPACE!);' > "$directory/cwd.ts"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "bun-version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.policy.outputs.bun-version }}
      - name: Select CI lane
        id: select
        env:
          TRUSTED_POLICY: ${{ steps.policy.outputs.directory }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
        shell: bash
        run: |
          cd "$TRUSTED_POLICY"
          bun --preload ./cwd.ts ./tools/ci-policy.ts classify

  check:
    needs: [classify]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          cache-turbo: 'true'
          cache-vitest: 'true'
      - name: API report approval
        env:
          API_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          git fetch --no-tags --depth=1 origin "$API_BASE_SHA"
          bun run api:approve -- --base "$API_BASE_SHA"
      - name: typecheck
        run: bun run check
      - name: tests
        run: bun run test
      - name: token drift gate
        run: bun run ci:tokens
      - name: Upload Ubuntu token outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: token-outputs-ubuntu
          if-no-files-found: error
          retention-days: 3
          path: |
            DESIGN.md
            packages/tokens/theme.css
            packages/motion/src/tokens.ts
            packages/tokens/tokens.css
      - name: build
        run: bun x turbo run build
      - name: Validate and pack prepared release
        if: needs.classify.outputs.release-only == 'true'
        env:
          VERSION: ${{ needs.classify.outputs.version }}
        run: |
          bun run release:check -- --version "$VERSION"
          bun tools/release.ts pack --tag "v$VERSION" --repository "$GITHUB_REPOSITORY"

  browser-shards:
    needs: [classify]
    if: ${{ always() && !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.browser != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap pinned Bun
        shell: bash
        run: |
          # The Playwright image has Node/npm but no unzip. Avoid a mutable APT index.
          version="$(cat .bun-version)"
          npm install --prefix "$RUNNER_TEMP/bun-bootstrap" --no-save --ignore-scripts --no-package-lock "@oven/bun-linux-x64@$version"
          install -D -m 755 "$RUNNER_TEMP/bun-bootstrap/node_modules/@oven/bun-linux-x64/bin/bun" "$HOME/.bun/bin/bun"
          export PATH="$HOME/.bun/bin:$PATH"
          test "$(bun --version)" = "$version"
      - uses: ./.github/actions/setup
      - name: Run browser authority
        run: bun run --cwd apps/gallery test:browser --shard=${{ matrix.shard }}/3
      - name: Upload browser timings
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-timings-${{ github.run_id }}-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 7
          path: apps/gallery/test-results/playwright-timing.json
      - name: Upload browser failure evidence
        if: ${{ failure() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-authority-${{ github.run_id }}-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            apps/gallery/playwright-report/
            apps/gallery/test-results/

  browser-authority:
    needs: [classify, browser-shards]
    if: ${{ always() && !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.browser != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all browser shards to succeed
        env:
          SHARDS_RESULT: ${{ needs.browser-shards.result }}
        run: test "$SHARDS_RESULT" = success

  token-outputs-windows:
    needs: [classify]
    if: ${{ always() && !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.release-only != 'true') }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # Keep cache and workspace on the same drive for Bun's hard-link installs.
      BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Check API reports
        run: bun run api:check
      - name: Generate token outputs
        run: bun run tokens:build
      - name: Upload Windows token outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: token-outputs-windows
          if-no-files-found: error
          retention-days: 3
          path: |
            DESIGN.md
            packages/tokens/theme.css
            packages/motion/src/tokens.ts
            packages/tokens/tokens.css

  token-byte-parity:
    needs: [classify, check, token-outputs-windows]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.token-outputs-windows.result == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.release-only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: token-outputs-ubuntu
          path: artifacts/ubuntu
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: token-outputs-windows
          path: artifacts/windows
      - name: Compare generated bytes
        shell: bash
        run: |
          files=(
            DESIGN.md
            packages/tokens/theme.css
            packages/motion/src/tokens.ts
            packages/tokens/tokens.css
          )
          for file in "${files[@]}"; do
            if ! cmp --silent "artifacts/ubuntu/$file" "artifacts/windows/$file"; then
              echo "::error file=$file::Ubuntu and Windows generated different bytes"
              sha256sum "artifacts/ubuntu/$file" "artifacts/windows/$file"
              exit 1
            fi
          done

  ci:
    if: ${{ always() }}
    needs: [classify, check, browser-authority, token-outputs-windows, token-byte-parity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Policy CLI/env changes require two steps: land policy support first, then workflow use.
      - name: Materialize trusted policy
        id: policy
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [[ "$GITHUB_EVENT_NAME" == pull_request || "$GITHUB_EVENT_NAME" == merge_group ]]; then
            [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'Invalid PR base SHA' >&2; exit 1; }
            git merge-base --is-ancestor "$BASE_SHA" origin/main || { echo 'PR base is not reachable from origin/main' >&2; exit 1; }
            revision="$BASE_SHA"
          else
            revision="$(git rev-parse origin/main)"
          fi
          directory="$(mktemp -d "$RUNNER_TEMP/ci-policy.XXXXXX")"
          mkdir "$directory/tools"
          # Complete local import closure; neither module reads files at load time.
          for file in tools/ci-policy.ts tools/ci-release.ts .bun-version; do
            git show "$revision:$file" > "$directory/$file"
          done
          version="$(cat "$directory/.bun-version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid trusted Bun version' >&2; exit 1; }
          # Start Bun outside checkout config discovery, then restore the existing CLI's cwd.
          echo 'process.chdir(process.env.GITHUB_WORKSPACE!);' > "$directory/cwd.ts"
          echo "directory=$directory" >> "$GITHUB_OUTPUT"
          echo "bun-version=$version" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ steps.policy.outputs.bun-version }}
      - name: Require selected jobs to succeed
        env:
          TRUSTED_POLICY: ${{ steps.policy.outputs.directory }}
          CI_NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          cd "$TRUSTED_POLICY"
          # Also cover dependencies added after the trusted policy's job list.
          bun -e 'if (Object.values(JSON.parse(process.env.CI_NEEDS ?? "{}")).some(need => ["failure", "cancelled"].includes(need.result))) { console.error("A CI dependency failed or was cancelled"); process.exit(1); }'
          bun --preload ./cwd.ts ./tools/ci-policy.ts aggregate
